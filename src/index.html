<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data: https://api.github.com">
<title>IBRA ZOMBIE</title>
<style>
@font-face{font-family:Handjet;font-weight:400;src:url(fonts/handjet-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:Handjet;font-weight:700;src:url(fonts/handjet-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:Handjet;font-weight:400;src:url(fonts/handjet-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Handjet;font-weight:700;src:url(fonts/handjet-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Ruqaa;font-weight:400;src:url(fonts/aref-ruqaa-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Ruqaa;font-weight:700;src:url(fonts/aref-ruqaa-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Ruqaa;font-weight:400;src:url(fonts/aref-ruqaa-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{--gold:#c9a84c;--gold2:#e8cf7a;--ink:#0b0b0f;--panel:#15151c;--line:#3a3a48;--green:#7fc24b;--red:#d24a3a;--txt:#efe9d8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;font-family:Handjet,Tahoma,sans-serif;color:var(--txt);user-select:none;font-size:20px}
canvas#gl{position:fixed;inset:0;width:100%;height:100%}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair}
[hidden]{display:none!important}
button{font:inherit;color:var(--txt);background:#20202a;border:2px solid var(--line);padding:6px 16px;cursor:pointer;box-shadow:3px 3px 0 #000}
button:hover,button:focus-visible{border-color:var(--gold);color:var(--gold2);outline:none}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
button.gold{background:var(--gold);color:#16120a;border-color:#7a6220;font-weight:700}
button.gold:hover{background:var(--gold2);color:#000}
input[type=text]{font:inherit;background:#0e0e14;color:var(--txt);border:2px solid var(--line);padding:6px 10px;width:100%;text-align:center}
input[type=text]:focus{outline:none;border-color:var(--gold)}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#bars{position:absolute;top:12px;inset-inline-start:12px;display:grid;gap:5px;background:rgba(10,10,14,.72);border:2px solid #000;outline:2px solid var(--line);padding:8px 10px}
.bar{display:flex;align-items:center;gap:8px}
.bar svg{width:18px;height:18px;flex:none;image-rendering:pixelated}
.bar .tr{width:150px;height:12px;background:#07070a;border:2px solid #000;outline:1px solid #444}
.bar .fl{height:100%;width:50%;transition:width .2s}
#b-hp .fl{background:#d24a3a}#b-food .fl{background:#d99a3c}#b-water .fl{background:#3c9bd9}#b-en .fl{background:#e3d24a}
.bar.low .tr{outline-color:#f44;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
#clock{position:absolute;top:12px;inset-inline-end:12px;background:rgba(10,10,14,.72);border:2px solid #000;outline:2px solid var(--line);padding:6px 14px;text-align:center;line-height:1.05}
#clock b{display:block;color:var(--gold2);font-size:26px}
#clock span{font-size:20px}
#clock i{display:block;font-style:normal;font-size:16px;color:#a9a493}
#mini{position:absolute;top:108px;inset-inline-end:12px;width:260px;height:130px;image-rendering:pixelated;border:2px solid #000;outline:2px solid var(--line);opacity:.92}
#obj{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:46%;background:rgba(10,10,14,.72);border:2px solid #000;outline:2px solid var(--gold);padding:5px 16px;text-align:center;font-size:21px;line-height:1.15}
#obj small{display:block;color:var(--gold2);font-size:15px;letter-spacing:1px}
#wep{position:absolute;bottom:12px;inset-inline-start:12px;background:rgba(10,10,14,.72);border:2px solid #000;outline:2px solid var(--line);padding:6px 14px;font-size:21px;line-height:1.15;min-width:150px}
#wep b{color:var(--gold2)} #wep i{font-style:normal;color:#a9a493;font-size:17px;display:block}
#comps{position:absolute;bottom:12px;inset-inline-end:12px;background:rgba(10,10,14,.72);border:2px solid #000;outline:2px solid var(--line);padding:6px 12px;font-size:18px;line-height:1.2;min-width:150px}
#comps div{display:flex;justify-content:space-between;gap:12px} #comps em{font-style:normal;color:var(--green)} #comps em.bad{color:var(--red)}
#prompt{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);background:#000;border:2px solid var(--gold);padding:3px 14px;font-size:22px;white-space:nowrap}
#prompt kbd{font:inherit;background:var(--gold);color:#000;padding:0 7px;margin-inline-end:8px;font-weight:700}
#toasts{position:absolute;bottom:132px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:70%}
.toast{background:rgba(8,8,12,.86);border-inline-start:4px solid var(--gold);padding:3px 14px;font-size:20px;animation:tin .2s steps(3);max-width:100%;text-align:center}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
#hurt{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(200,20,20,.55);opacity:0}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
#fade.on{opacity:1}

#lapse{position:fixed;top:7%;left:0;right:0;text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.85);pointer-events:none;font-family:'Segoe UI',Tahoma,sans-serif}
#lapse b{display:block;font-size:76px;font-weight:600;letter-spacing:3px;direction:ltr;line-height:1}
#lapse span{display:block;font-size:27px;margin-top:8px;letter-spacing:1px}
#lapse i{position:fixed;bottom:18px;left:0;right:0;font-style:normal;font-size:16px;opacity:.6}
/* dialog */
#dlg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(820px,92%);background:var(--panel);border:3px solid #000;outline:3px solid var(--gold);padding:12px 18px 14px;box-shadow:6px 6px 0 rgba(0,0,0,.6)}
#dlg h4{margin:0 0 4px;color:var(--gold2);font-size:23px}
#dlg p{margin:0;font-size:24px;line-height:1.25;white-space:pre-wrap}
#dlg .opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
#dlg .opts button{text-align:start;font-size:21px;padding:4px 12px}
#dlg .hint{font-size:16px;color:#8d8878;margin-top:6px;text-align:end}

/* notebook */
#nb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center}
#nb .page{width:min(760px,88%);min-height:62%;max-height:90%;overflow:hidden;background:#f3ecd2;color:#1d2a55;padding:26px 44px 30px;position:relative;border:3px solid #000;box-shadow:10px 10px 0 rgba(0,0,0,.6);
 background-image:linear-gradient(#c7d0e6 1.5px,transparent 1.5px);background-size:100% 44px;background-position:0 62px;font-family:Ruqaa,'Segoe Script',cursive;transform:rotate(-.6deg)}
#nb .page:before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:30px;width:2px;background:#e59a9a}
#nb h3{margin:0 0 6px;font-size:38px;line-height:44px;color:#8a1f1f;font-weight:700}
#nb p{margin:0;font-size:29px;line-height:44px;min-height:44px}
#nb p.strike{text-decoration:line-through;text-decoration-thickness:3px;color:#7b84a3}
#nb .hint{position:absolute;bottom:8px;inset-inline-end:18px;font-family:Handjet,Tahoma;font-size:18px;color:#7b6a3a}

/* menu */
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(5,5,8,.35),rgba(5,5,8,.86))}
#logo{font-weight:700;font-size:118px;line-height:.9;letter-spacing:4px;color:var(--gold);text-shadow:5px 5px 0 #000,-2px -2px 0 #000;direction:ltr}
#logo span{color:var(--green)}
#sub{font-size:40px;color:#f1ead6;text-shadow:3px 3px 0 #000;margin:2px 0 20px}
#mbtns{display:grid;gap:9px;width:300px}
#mbtns button{font-size:26px;padding:5px}
#ver{position:fixed;bottom:8px;left:12px;font-size:17px;color:#9b957f;direction:ltr}
#credit{position:fixed;bottom:8px;right:12px;font-size:18px;color:var(--gold)}
#upd{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#12210c;border:3px solid #000;outline:3px solid var(--green);padding:8px 16px;display:flex;gap:12px;align-items:center;font-size:21px;z-index:9}

/* panel */
#panel{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:5}
#panel .box{width:min(760px,92%);max-height:88%;overflow:auto;background:var(--panel);border:3px solid #000;outline:3px solid var(--gold);padding:14px 20px 18px;box-shadow:8px 8px 0 rgba(0,0,0,.6)}
#panel h2{margin:0 0 10px;color:var(--gold2);font-size:34px;display:flex;justify-content:space-between;align-items:center}
#panel h3{margin:12px 0 4px;color:var(--gold);font-size:24px;border-bottom:2px solid var(--line)}
#panel .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:3px 0;font-size:22px;border-bottom:1px dashed #2a2a36}
#panel .row small{color:#a9a493;font-size:17px}
#panel .row button{font-size:18px;padding:1px 12px}
#panel .col{display:grid;gap:8px}
#panel p{margin:4px 0;font-size:22px;line-height:1.25}
#panel a{color:var(--gold2);cursor:pointer;text-decoration:underline}
#panel canvas{width:100%;image-rendering:pixelated;border:2px solid #000}
#panel table{width:100%;border-collapse:collapse;font-size:21px} #panel td{padding:2px 6px;border-bottom:1px dashed #2a2a36} #panel td:first-child{color:var(--gold2);white-space:nowrap;direction:ltr;text-align:center;width:38%}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--gold)}::-webkit-scrollbar-track{background:#0a0a0e}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div id="bars">
    <div class="bar" id="b-hp"><svg viewBox="0 0 9 9"><path fill="#d24a3a" d="M1 1h3v1h1V1h3v1h1v3H8v1H7v1H6v1H5v1H4V8H3V7H2V6H1V5H0V2h1z"/></svg><div class="tr"><div class="fl"></div></div></div>
    <div class="bar" id="b-food"><svg viewBox="0 0 9 9"><path fill="#d99a3c" d="M2 2h5v1h1v1h1v3H8v1H1V7H0V4h1V3h1z"/><path fill="#8a5a1c" d="M3 4h1v2H3zM5 4h1v2H5z"/></svg><div class="tr"><div class="fl"></div></div></div>
    <div class="bar" id="b-water"><svg viewBox="0 0 9 9"><path fill="#3c9bd9" d="M4 0h1v1h1v2h1v1h1v3H7v1H6v1H3V8H2V7H1V4h1V3h1V1h1z"/></svg><div class="tr"><div class="fl"></div></div></div>
    <div class="bar" id="b-en"><svg viewBox="0 0 9 9"><path fill="#e3d24a" d="M5 0h2L5 3h3L3 9h-1l2-4H1z"/></svg><div class="tr"><div class="fl"></div></div></div>
  </div>
  <div id="obj"><small></small><span></span></div>
  <div id="clock"><b></b><span></span><i></i></div>
  <canvas id="mini" width="448" height="224"></canvas>
  <div id="wep"><b></b><i></i></div>
  <div id="comps" hidden></div>
  <div id="toasts"></div>
  <div id="prompt" hidden></div>
</div>
<div id="lapse" hidden><b></b><span></span><i></i></div>
<div id="hurt"></div>
<div id="fade"></div>

<div id="menu">
  <div id="logo">IBRA <span>ZOMBIE</span></div>
  <div id="sub"></div>
  <div id="mbtns"></div>
  <div id="ver"></div>
  <div id="credit"></div>
</div>
<div id="upd" hidden></div>

<div id="dlg" hidden><h4></h4><p></p><div class="opts"></div><div class="hint"></div></div>
<div id="nb" hidden><div class="page"><h3></h3><div class="body"></div><div class="hint"></div></div></div>
<div id="panel" hidden><div class="box"></div></div>

<script src="art.js"></script>
<script src="world.js"></script>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="view3d.js"></script>
<script src="game.js"></script>
</body>
</html>
