<!doctype html>
<html lang="ar" dir="rtl">
<head>

<style>

</head>
<body>
<div id="clock"><b></b><span></span></div><div id="vig"></div>
<script src="art.js"></script><script src="world.js"></script><script src="vendor/three.min.js"></script>

'use strict';
World.gen();

// ---------- barriers, fences
{ const tm = M('#8d8c84'), g1 = new THREE.BoxGeometry(.96, 1.9, .5), g2 = new THREE.BoxGeometry(.5, 1.9, .96); let n = 0; for (let i = 0; i < W * H; i++) if (T[i] === 7 || T[i] === 11) n++;

const figs = [];
function fig(x, z, o) { const g = new THREE.Group(), sm = M(o.skin), cm = M(o.shirt), pm = M(o.pants || '#2c2f36');
  const lg = [box(.13, .42, .15, pm, -.08, .21, 0, g), box(.13, .42, .15, pm, .08, .21, 0, g)]; box(.36, o.robe ? .75 : .42, .2, cm, 0, o.robe ? .5 : .63, 0, g);
  const ar = [box(.1, .4, .12, cm, -.24, .64, 0, g), box(.1, .4, .12, cm, .24, .64, 0, g)]; const hd = new THREE.Mesh(new THREE.SphereGeometry(.13, 10, 8), sm); hd.position.y = .98; hd.castShadow = true; g.add(hd);
  if (o.hat) box(.3, .1, .3, M(o.hat), 0, 1.08, 0, g); if (o.z) { ar[0].rotation.x = ar[1].rotation.x = -1.35; ar[0].position.set(-.2, .76, .2); ar[1].position.set(.2, .76, .2); }
  g.position.set(x, 0, z); g.rotation.y = rr(0, 6.28); scene.add(g); figs.push({ g, lg, z: o.z, ph: rr(0, 6), sp: o.z ? rr(.25, .45) : 0, t: rr(1, 4) }); return g; }
const hero = fig(World.spots.homeDoor.x / 16 + 1.5, World.spots.homeDoor.y / 16 + .6, { skin: '#c99870', shirt: '#b8963f' }); hero.rotation.y = 1.2;
fig(World.spots.hassan.x / 16, World.spots.hassan.y / 16 + .4, { skin: '#8ba27a', shirt: '#d9d4c4', robe: 1, z: 1 });
for (let i = 0; i < 140; i++) { const p = World.randOutdoor((i % 4)); if (!p) continue; fig(p.x / 16, p.y / 16, { skin: ['#8ba27a', '#7d9684', '#93a678'][i % 3], shirt: ['#6e4848', '#48566e', '#62624e', '#cfd6dc', '#9a9482'][i % 5], z: 1, robe: i % 6 === 0, hat: i % 7 === 0 ? '#e8e8e8' : null }); }

// ---------- lighting by time of day
const sun = new THREE.DirectionalLight(0xffffff, 1); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -.0006; sun.shadow.normalBias = .03; scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xbcd0e6, 0x8a7a5a, .5); scene.add(hemi);
const lampLights = []; for (let i = 0; i < 6; i++) { const l = new THREE.SpotLight(0xffe2b0, 0, 16, .95, .7, 1.2); l.castShadow = i < 2; l.shadow.mapSize.set(1024, 1024); scene.add(l, l.target); lampLights.push(l); }
const cA = new THREE.Color(), cB = new THREE.Color(), lerpC = (a, b, t) => cA.set(a).lerp(cB.set(b), t).clone();
function setTime(h) {
  const day = h >= 5.5 && h <= 18.5, ph = day ? (h - 5.5) / 13 : ((h < 5.5 ? h + 24 : h) - 18.5) / 11, el = Math.sin(ph * Math.PI) * (day ? 1.15 : .7) + .06, az = -1.9 + ph * 2.6, low = Math.max(0, 1 - el / .55);
  const edge = Math.min(1, Math.min(Math.abs(h - 5.5), Math.abs(h - 18.5)) / 1.1);       // fades at dawn/dusk
  sun.color.copy(day ? lerpC('#fff4e0', '#ff9a4a', low * low) : new THREE.Color('#7d93c8')); sun.intensity = (day ? 2.6 - low * .9 : .16) * (day ? Math.max(.12, edge) : 1);
  const d = 90; sun.position.set(tgt.x + Math.cos(az) * Math.cos(el) * d, Math.sin(el) * d, tgt.z + Math.sin(az) * Math.cos(el) * d - 20 * Math.cos(el)); sun.target.position.copy(tgt);
  const s = view * 2.6 + 12, c = sun.shadow.camera; c.left = -s; c.right = s; c.top = s; c.bottom = -s; c.near = 1; c.far = 260; c.updateProjectionMatrix();
  hemi.intensity = day ? .32 + .3 * edge : .1; hemi.color.copy(day ? lerpC('#c4d6ea', '#e6a67a', low * low) : new THREE.Color('#2a3760')); hemi.groundColor.set(day ? '#8a7a5a' : '#0a0c16');
  scene.background = day ? lerpC('#2a2620', '#1c1410', low) : new THREE.Color('#04050a'); renderer.toneMappingExposure = day ? 1.02 : .95;
  const on = !day || edge < .35, near = lamps.slice().sort((a, b) => Math.hypot(a.x - tgt.x, a.z - tgt.z) - Math.hypot(b.x - tgt.x, b.z - tgt.z));
  lamps.forEach(l => l.mesh.material.emissiveIntensity = on ? 3 : 0);
  lampLights.forEach((l, i) => { const p = near[i]; if (!p || !on) { l.intensity = 0; return; } l.intensity = 34; l.position.set(p.x, 4.1, p.z); l.target.position.set(p.x + .2, 0, p.z + .3); });
  const hh = Math.floor(h), mm = Math.floor((h - hh) * 60); document.querySelector('#clock b').textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
}
document.querySelector('#clock span').textContent = 'اليوم الأول — بغداد الجديدة';
let hour = +(Q.get('t') || 8.5); const fixed = Q.has('t'), keys = {};
addEventListener('keydown', e => keys[e.code] = 1); addEventListener('keyup', e => keys[e.code] = 0);
addEventListener('wheel', e => { view = Math.max(6, Math.min(40, view + Math.sign(e.deltaY) * 1.5)); });
addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));
let last = performance.now();
function loop(now) { const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!fixed) hour = (hour + dt * .35) % 24;
  const sp = view * dt * 1.2, fx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0), fz = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  tgt.x += (fx * Math.cos(yaw) + fz * Math.sin(yaw)) * sp; tgt.z += (-fx * Math.sin(yaw) + fz * Math.cos(yaw)) * sp;
  for (const f of figs) if (f.z) { f.t -= dt; if (f.t <= 0) { f.t = rr(2, 6); f.g.rotation.y += rr(-1.2, 1.2); } f.ph += dt * 5; const nx = f.g.position.x + Math.sin(f.g.rotation.y) * f.sp * dt, nz = f.g.position.z + Math.cos(f.g.rotation.y) * f.sp * dt; if (!World.solid(nx | 0, nz | 0)) { f.g.position.x = nx; f.g.position.z = nz; } else f.g.rotation.y += 2; f.lg[0].rotation.x = Math.sin(f.ph) * .5; f.lg[1].rotation.x = -Math.sin(f.ph) * .5; f.g.rotation.z = Math.sin(f.ph * .5) * .12; }
  placeCam(); setTime(hour); renderer.render(scene, cam); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
